name: ScaleFlow probe
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-evidence
          path: |
            report.json
            screenshot.png
